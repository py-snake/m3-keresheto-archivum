# Hardened nginx server definition for the PHP version (replaces the image default, see docker-compose.yml).
#
# Allowlist, not denylist: only the front controller routes and /public/ are reachable.
# Everything else (application/, system/, backup/, tests/, *.md, docker-compose.yml, /cron, ...)
# answers 404 -- the .htaccess rules of the Apache setup do not exist under nginx.
#
# Cron jobs are CLI only:  php index.php cron daily|weekly|backup|csv

server {
    listen [::]:8080 default_server;
    listen 8080 default_server;
    server_name _;

    sendfile off;
    tcp_nodelay on;
    absolute_redirect off;
    server_tokens off;

    root /var/www/html;

    # The only legitimate request is a short GET or a tiny form POST.
    client_max_body_size 4k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    # Behind a Cloudflare Tunnel the peer is the cloudflared container: restore the real client IP.
    # Set the cloudflared network below and enable both lines (also set TRUSTED_PROXIES for the app).
    # set_real_ip_from 10.89.0.0/24;
    # real_ip_header CF-Connecting-IP;

    # Security headers. The CSP is Report-Only on purpose: the current UI uses an inline script and
    # external CSS/fonts, so an enforced policy has not been checked in a real browser. The Go rewrite
    # enforces a strict CSP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src https://fonts.gstatic.com https://unpkg.com; img-src 'self' data: https://nemzetiarchivum.hu; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;

    # --- application routes (CodeIgniter front controller) ---
    location = / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        rewrite ^ /index.php last;
    }

    # pagination: /2, /3, ...
    location ~ ^/[0-9]+$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        rewrite ^ /index.php last;
    }

    # add programs by id (POST only; the app also checks Origin and rate limits)
    location = /add {
        rewrite ^ /index.php last;
    }

    # --- static assets and the generated exports ---
    location ^~ /public/ {
        location ~ \.(php|tmp)$ { return 404; }
        try_files $uri =404;
        expires 5d;
    }

    # --- PHP: only the front controller, never directly from outside ---
    location = /index.php {
        internal;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # everything else
    location / {
        return 404;
    }
}
