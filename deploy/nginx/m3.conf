# nginx site for the m3 archive. Path: Cloudflare Tunnel -> nginx -> m3-web.
# Put it into the directory mounted as /etc/nginx/conf.d, change server_name, then `nginx -t` and reload.
#
# m3-web has a fixed address on the m3-internal network (m3-web.container: ip=10.89.77.10), so nginx
# needs no DNS for it and starts even while m3-web is down (visitors then get 502, other sites are not
# affected).

upstream m3_web {
    server 10.89.77.10:8080;
    keepalive 16;
}

server {
    listen 8080;                  # nginx-unprivileged listens on 8080
    server_name m3.example.hu;    # CHANGE: the subdomain that the Cloudflare tunnel sends here

    # The archive is read-only: nothing but GET and HEAD goes through.
    location / {
        limit_except GET HEAD { deny all; }

        proxy_pass http://m3_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        # m3-web believes these only from its trusted proxy (nginx); Cloudflare sets CF-Connecting-IP at its
        # edge and the visitor cannot forge it through the tunnel. It is passed on explicitly, and a value
        # that is not there is not invented.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;

        # Do not add security headers here: m3-web sends its own (CSP, nosniff, ...) and nginx passes them on.
    }
}
