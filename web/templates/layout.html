{{define "layout"}}<!DOCTYPE html>
<html lang="hu">
<head>
	<meta charset="utf-8">
	<title>{{.Title}}</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="referrer" content="no-referrer">
	<link rel="icon" href="/static/logo.png" type="image/png">
	<link rel="stylesheet" href="/static/m3.min.css">
	<link rel="stylesheet" href="/static/app.css?v=4">
	{{block "head" .}}{{end}}
</head>
<body class="mdc-typography">
	<header>
		<h1 class="mdc-typography--headline5"><a class="home" href="/">{{.Title}}</a></h1>
	</header>

	<main class="main-content mdc-typography--body2">
		{{template "content" .}}
	</main>

	<footer class="mdc-typography--caption">
		{{if .Elapsed}}<div>{{.Elapsed}}</div>{{end}}
		<nav class="footer-links">
			{{if .ShowExport}}<a href="/export/">Letöltések</a>{{end}}
			{{if .ShowAPI}}<a href="/api/">API</a>{{end}}
			<a href="https://github.com/py-snake/m3-keresheto-archivum" rel="noopener noreferrer">forráskód</a>
		</nav>
	</footer>
</body>
</html>{{end}}
